# BusTracker Helm values.
# Targets the in-cluster Pi registry; override image fields when using GHCR.

nameOverride: ""
fullnameOverride: ""

image:
  registry: 192.168.1.101:30500
  repository: bustracker
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets: []

web:
  replicas: 1
  port: 3000
  # Give the pod 30 min to become Ready before Kubernetes marks the rollout
  # failed. Pi nodes can be slow to pull + run Prisma init + start Next.js.
  progressDeadlineSeconds: 1800
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 6   # 30s initial + 6×10s = 90s before giving up
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 20
    failureThreshold: 3
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1", memory: 512Mi }

# Paths inside the container for the two SQLite databases.
# Both land on the PVC mounted at /data.
databasePath: /data/dev.db
gtfsDbPath: /data/gtfs.db

# PersistentVolumeClaim for SQLite data (dev.db + gtfs.db).
# k3s ships local-path provisioner by default; change storageClass for other clusters.
persistence:
  enabled: true
  storageClass: local-path
  size: 4Gi
  accessMode: ReadWriteOnce

ingress:
  enabled: true
  className: traefik
  host: ""
  annotations: {}
  tls: []

service:
  type: NodePort
  nodePort: 30400   # external port on every cluster node; change if already taken

# NTA GTFS-RT API key (https://developer.nationaltransport.ie).
# Leave empty to fetch the public feed without a key (may be rate-limited).
ntaApiKey: ""

# Weekly GTFS timetable refresh CronJob (writes to the PVC, app hot-reloads).
gtfsRefresh:
  enabled: true
  schedule: "17 3 * * 1"   # weekly, Monday 03:17 Europe/Dublin

# Weekly containerd image prune on each Pi node to prevent ephemeral-storage
# exhaustion from accumulated image layers across deployments.
imagePrune:
  enabled: true
  schedule: "30 4 * * 1"   # Monday 04:30, after GTFS refresh
  nodes:
    - rpi1
    - rpi2
    - rpi3
